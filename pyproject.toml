[project]
name = "sjaq"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Nacocx", email = "88483952+Nacocx@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pillow>=13.0.0",
    "python-pptx>=1.0.2",
